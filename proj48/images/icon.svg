<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Cyber frame corner markers -->
  <path d="M 16 28 L 16 16 L 28 16" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 112 28 L 112 16 L 100 16" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 16 100 L 16 112 L 28 112" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 112 100 L 112 112 L 100 112" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Head / Face silhouette -->
  <circle cx="64" cy="52" r="26" fill="none" stroke="url(#avatarGrad)" stroke-width="3.5" filter="url(#glow)"/>
  
  <!-- Eyes -->
  <ellipse cx="54" cy="48" rx="3.5" ry="4.5" fill="#f472b6"/>
  <ellipse cx="74" cy="48" rx="3.5" ry="4.5" fill="#f472b6"/>
  <circle cx="55.5" cy="46.5" r="1.5" fill="#ffffff"/>
  <circle cx="75.5" cy="46.5" r="1.5" fill="#ffffff"/>

  <!-- Speaking Mouth (A shape) -->
  <path d="M 54 62 Q 64 74 74 62 Q 64 66 54 62 Z" fill="#ec4899" stroke="#f472b6" stroke-width="1.5"/>

  <!-- Sound Waves / Audio Bars -->
  <line x1="22" y1="52" x2="30" y2="52" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="44" x2="26" y2="44" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="60" x2="26" y2="60" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>

  <line x1="106" y1="52" x2="98" y2="52" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="44" x2="102" y2="44" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="110" y1="60" x2="102" y2="60" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Audio Waveform below -->
  <rect x="36" y="90" width="4" height="14" rx="2" fill="#a855f7"/>
  <rect x="44" y="84" width="4" height="20" rx="2" fill="#c084fc"/>
  <rect x="52" y="80" width="4" height="24" rx="2" fill="#ec4899"/>
  <rect x="60" y="76" width="4" height="28" rx="2" fill="#f472b6"/>
  <rect x="68" y="80" width="4" height="24" rx="2" fill="#ec4899"/>
  <rect x="76" y="84" width="4" height="20" rx="2" fill="#c084fc"/>
  <rect x="84" y="90" width="4" height="14" rx="2" fill="#a855f7"/>
  <rect x="92" y="94" width="4" height="10" rx="2" fill="#818cf8"/>
  <rect x="28" y="94" width="4" height="10" rx="2" fill="#818cf8"/>
</svg>
