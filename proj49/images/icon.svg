<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Rounded Rect -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Radar / HUD Circles -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Crosshairs -->
  <line x1="256" y1="46" x2="256" y2="96" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="256" y1="416" x2="256" y2="466" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="46" y1="256" x2="96" y2="256" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="416" y1="256" x2="466" y2="256" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Flight Departure Vector Trail -->
  <path d="M 120 390 Q 180 340 220 280 T 360 140" fill="none" stroke="url(#trailGrad)" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Jet Aircraft Silhouette (Climbing 32L Departure Vector) -->
  <g transform="translate(256, 230) rotate(-45) translate(-256, -256)" filter="url(#neonGlow)">
    <!-- Fuselage & Wings -->
    <path d="M 256 120 
             C 264 120 270 140 270 190 
             L 390 280 
             L 390 310 
             L 270 270 
             L 270 360 
             L 310 400 
             L 310 420 
             L 256 405 
             L 202 420 
             L 202 400 
             L 242 360 
             L 242 270 
             L 122 310 
             L 122 280 
             L 242 190 
             C 242 140 248 120 256 120 Z" 
          fill="url(#planeGrad)" 
          stroke="#fff" 
          stroke-width="3" 
          stroke-linejoin="round"/>
  </g>

  <!-- Runway 32L Indicator Text & Corner Badges -->
  <text x="256" y="440" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="22" font-weight="900" fill="#f59e0b" letter-spacing="4">RJOO • RWY 32L</text>
  <text x="256" y="100" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" fill="#06b6d4" letter-spacing="3">FLIGHT DEPARTURE</text>
</svg>
